# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Creates the web service, a managed Postgres and a persistent disk for
# uploads. From the Render dashboard: New → Blueprint → pick this repository.
#
# No secrets live in this file. DATABASE_URL is wired from the managed database
# and BETTER_AUTH_SECRET is generated by Render, so there is nothing to paste in
# for a first deploy. Object-storage credentials, if you move media off the
# disk, belong in the dashboard rather than here.

databases:
  - name: comlabs-cms-db
    databaseName: comlabs_cms
    user: cms
    # Free tier is fine to start; Render expires free databases after a trial
    # period, so move to a paid plan before you have content you care about.
    plan: free
    region: oregon

services:
  - type: web
    name: comlabs-cms
    runtime: docker
    repo: https://github.com/comlabs-technologies/mavryn
    branch: claude/epic-hypatia-n6s81y
    region: oregon          # must match the database's region
    plan: starter           # `free` also works, but instances sleep when idle
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .        # the Dockerfile expects the repo root as context

    # /api/health runs SELECT 1, so an instance that cannot reach Postgres is
    # reported unhealthy instead of silently serving errors.
    healthCheckPath: /api/health

    # Uploads live here when MEDIA_PROVIDER=local. A disk pins the service to a
    # single instance and rules out zero-downtime deploys — fine to start,
    # but switch to MEDIA_PROVIDER=s3 (R2 works) before scaling out.
    disk:
      name: comlabs-cms-media
      mountPath: /app/.media
      sizeGB: 1

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: comlabs-cms-db
          property: connectionString

      # Generated once by Render and kept across deploys. Changing it signs
      # everyone out, so do not regenerate it casually.
      - key: BETTER_AUTH_SECRET
        generateValue: true

      # The app derives its public URL from RENDER_EXTERNAL_URL at runtime and
      # from the request in the browser, so no URL is baked into the build.
      # Set BETTER_AUTH_URL yourself only once you attach a custom domain.
      - key: MEDIA_PROVIDER
        value: local
      - key: LOCAL_MEDIA_DIR
        value: /app/.media
      - key: NODE_ENV
        value: production
      - key: RUN_MIGRATIONS
        value: "1"
